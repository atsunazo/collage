<script>
const bgImgCache=new Map();function boardBg(){return S.bgImg?`${S.bg} url("${S.bgImg}") center/cover no-repeat`:S.bg}

'use strict';
const $=s=>document.querySelector(s),board=$('#board'),ws=$('#workspace');
let S={n:4,cols:2,shape:'1',gap:8,bg:'#ffffff',slots:Array(4).fill(null)},history=[],hi=-1,selected=-1,swapFrom=-1,pickTarget=-1,loading=false,editorReady=false,editId=null,pendingEdit=null;
const images=new Map(),urls=new Set();let timer;const copyPhoto=x=>x?{...x,masks:x.masks?JSON.parse(JSON.stringify(x.masks)):undefined}:null;const clone=s=>({...s,slots:s.slots.map(copyPhoto),parked:(s.parked||[]).map(copyPhoto)});
function toast(t){$('#toast').textContent=t;$('#toast').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('#toast').hidden=true,3500)}
function commit(){history=history.slice(0,hi+1);history.push(clone(S));if(history.length>16)history.shift();hi=history.length-1;render()}
function restore(i){if(i<0||i>=history.length)return;hi=i;S=clone(history[i]);swapFrom=-1;render()}
const SHAPES=['1','0.8','1.3333333333'];function boardRatio(){const r=Number(S.shape);return r>0?r:1}function grid(){const rows=Math.ceil(S.n/S.cols);return{rows,ratio:boardRatio()}}
function dimensions(edge){const {rows,ratio}=grid();const W=ratio>=1?edge:Math.round(edge*ratio),H=ratio>=1?Math.round(edge/ratio):edge;const gap=S.gap*edge/1600;return{W,H,gap,cw:(W-gap*(S.cols+1))/S.cols,ch:(H-gap*(rows+1))/rows,rows}}
function sizeBoard(){const {ratio}=grid();const w=Math.max(50,ws.clientWidth-28),h=Math.max(50,ws.clientHeight-28);const W=Math.min(w,h*ratio),H=W/ratio;board.style.width=W+'px';board.style.height=H+'px';board.style.gridTemplateColumns=`repeat(${S.cols},minmax(0,1fr))`;board.style.gridTemplateRows=`repeat(${Math.ceil(S.n/S.cols)},minmax(0,1fr))`;const g=S.gap*Math.max(W,H)/1600;board.style.padding=g+'px';board.style.gap=g+'px';board.style.background=boardBg()}
function render(){board.replaceChildren();S.slots.forEach((p,i)=>{const b=document.createElement('button');b.className='cell'+(!p?' empty':'')+(swapFrom===i?' swap':'');b.setAttribute('aria-label',p?`${i+1}枚目を編集`:`${i+1}枚目を追加`);if(p){const im=document.createElement('img');im.src=p.src;im.alt='';applyImageStyle(im,p);b.append(im);const no=document.createElement('span');no.className='number';no.textContent=i+1;b.append(no)}else b.innerHTML='<span class="plus"><b>＋</b>写真を選ぶ</span>';b.onclick=()=>cellClick(i);board.append(b)});sizeBoard();$('#countValue').textContent=S.n+'枚';$('#undo').disabled=hi<=0;$('#redo').disabled=hi>=history.length-1;const has=S.slots.some(Boolean);$('#save').disabled=!has||loading;$('#share').disabled=!has||loading;$('#add').disabled=loading;$('#add').textContent=loading?'読込中…':'写真を選ぶ';$('#hint').textContent=swapFrom>=0?'入れ替え先の枠をタップしてください':has?'写真をタップして、顔隠し・調整・入れ替え':'空いている枠の＋から、1枚ずつ追加できます'}
function applyImageStyle(im,p){im.style.objectFit=p.fit||'contain';im.style.objectPosition=(p.x??50)+'% '+(p.y??50)+'%';im.style.transform=`scale(${p.zoom||1})`;im.style.transformOrigin=(p.x??50)+'% '+(p.y??50)+'%'}
function sheet(title,content){$('#sheetTitle').textContent=title;$('#sheetBody').replaceChildren();if(typeof content==='string')$('#sheetBody').innerHTML=content;else $('#sheetBody').append(content);if(!$('#sheet').open)$('#sheet').showModal()}
function close(){$('#sheet').close()}$('#closeSheet').onclick=close;$('#sheet').addEventListener('click',e=>{if(e.target===$('#sheet')){const r=$('#sheet').getBoundingClientRect();if(e.clientY<r.top)close()}});
function choices(items,active,fn){const d=document.createElement('div');d.className='choices';items.forEach(([value,label])=>{const b=document.createElement('button');b.textContent=label;if(value===active)b.className='active';b.onclick=()=>fn(value);d.append(b)});return d}
function setCount(n){n=Math.max(2,Math.min(9,n));if(n===S.n)return;const all=[...S.slots,...(S.parked||[])];S.n=n;S.slots=Array.from({length:n},(_,i)=>all[i]||null);S.parked=all.slice(n);while(S.parked.length&&!S.parked.at(-1))S.parked.pop();S.cols=Math.min(S.cols,n);swapFrom=-1;selected=-1;if(S.auto!==false)recommendLayout();commit()}
$('#countMinus').onclick=()=>setCount(S.n-1);$('#countPlus').onclick=()=>setCount(S.n+1);


const oldGapSheet=()=>sheet('余白',choices([[0,'なし'],[8,'小'],[24,'大']],S.gap,v=>{S.gap=v;commit();close()}));
const oldBgSheet=()=>{const d=document.createElement('div'),c=choices([['#ffffff','白'],['#18151b','黒'],['#fff0f6','ピンク']],S.bg,v=>{S.bg=v;commit();close()});d.append(c);const l=document.createElement('label');l.className='rangeRow';l.textContent='好きな色 ';const input=document.createElement('input');input.type='color';input.value=S.bg;input.onchange=()=>{S.bg=input.value;commit();close()};l.append(input);d.append(l);sheet('背景',d)};
function pick(i=-1){pickTarget=i;$('#files').multiple=i<0;$('#files').click()}$('#add').onclick=()=>{if(!S.slots.includes(null)){toast('すべての枠に写真が入っています。写真をタップして変更できます');return}pick()};
function cellClick(i){if(loading)return;if(swapFrom>=0){[S.slots[i],S.slots[swapFrom]]=[S.slots[swapFrom],S.slots[i]];swapFrom=-1;commit();return}if(!S.slots[i]){pick(i);return}selected=i;const d=document.createElement('div');d.className='sheetActions';[['写る範囲を調整',()=>adjust(i)],['顔を隠す・写真を編集',()=>openEditor(i)],['ラベルを付ける',()=>editLabel(i)],['別の写真に変更',()=>{close();pick(i)}],['別の枠と入れ替え',()=>{close();swapFrom=i;render()}],['この写真を外す',()=>{S.slots[i]=null;close();commit()}]].forEach(([text,fn])=>{const b=document.createElement('button');b.textContent=text;b.onclick=fn;d.append(b)});sheet((i+1)+'枚目の写真',d)}
function placeRecords(records,target,empty){records.forEach((p,i)=>{const dest=target>=0?target:empty[i];if(dest!==undefined)S.slots[dest]=p});close();commit()}
function chooseImports(records,max,target,empty){let chosen=records.map((_,i)=>i).slice(0,max);function show(){const d=document.createElement('div'),list=document.createElement('div');list.className='overflowList';records.forEach((p,i)=>{const b=document.createElement('button');b.className=chosen.includes(i)?'active':'';const im=new Image();im.src=p.src;const no=document.createElement('span');no.textContent=chosen.includes(i)?chosen.indexOf(i)+1:'−';b.append(im,no);b.onclick=()=>{if(chosen.includes(i))chosen=chosen.filter(v=>v!==i);else if(chosen.length<max)chosen.push(i);else toast(max+'枚まで選べます');show()};list.append(b)});const b=document.createElement('button');b.className='primary';b.textContent='選んだ'+chosen.length+'枚を配置';b.disabled=!chosen.length;b.onclick=()=>placeRecords(chosen.map(i=>records[i]),target,empty);d.append(list,b);sheet('使用する写真を選択（'+max+'枚まで）',d)}show()}
function adjust(i){const p={...S.slots[i]},d=document.createElement('div');d.innerHTML='<div class="adjustPreview"><div class="aperture"><img alt="写る範囲のプレビュー"></div></div><p class="label">表示方法</p>';const aperture=d.querySelector('.aperture'),im=d.querySelector('img');im.src=p.src;const dims=dimensions(1600),box=cellBoxes(dims)[i],ratio=box.w/box.h;aperture.style.width='100%';aperture.style.aspectRatio=ratio;aperture.style.height='auto';const update=()=>{applyImageStyle(im,p);aperture.style.background=S.bg};d.append(choices([['cover','枠いっぱい'],['contain','全体を表示']],p.fit,v=>{p.fit=v;update();d.querySelectorAll('.choices button').forEach(b=>b.classList.toggle('active',b.textContent===(v==='cover'?'枠いっぱい':'全体を表示')))}));[['zoom','拡大',1,3,.01],['x','左右',0,100,1],['y','上下',0,100,1]].forEach(([key,label,min,max,step])=>{const row=document.createElement('label');row.className='rangeRow';row.innerHTML='<span>'+label+'</span>';const r=document.createElement('input');r.type='range';Object.assign(r,{min,max,step,value:p[key]??50});r.oninput=()=>{p[key]=+r.value;update()};row.append(r);d.append(row)});const actions=document.createElement('div');actions.className='choices';[['キャンセル',close],['決定',()=>{S.slots[i]=p;close();commit()}]].forEach(([t,fn])=>{const b=document.createElement('button');b.textContent=t;b.onclick=fn;if(t==='決定')b.className='primary';actions.append(b)});d.append(actions);let pts=new Map(),gs=null;function gestureStart(){const a=[...pts.values()];gs={x:p.x??50,y:p.y??50,z:p.zoom||1,cx:a.reduce((s,v)=>s+v.x,0)/a.length,cy:a.reduce((s,v)=>s+v.y,0)/a.length,d:a.length>1?Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y):0}}aperture.onpointerdown=e=>{e.preventDefault();aperture.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});gestureStart()};aperture.onpointermove=e=>{if(!pts.has(e.pointerId)||!gs)return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});const a=[...pts.values()],cx=a.reduce((s,v)=>s+v.x,0)/a.length,cy=a.reduce((s,v)=>s+v.y,0)/a.length;if(a.length>1&&gs.d)p.zoom=Math.max(1,Math.min(3,gs.z*Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)/gs.d));const w=aperture.clientWidth,h=aperture.clientHeight,k=(p.fit==='cover'?Math.max(w/p.w,h/p.h):Math.min(w/p.w,h/p.h))*(p.zoom||1),dx=w-p.w*k,dy=h-p.h*k;if(Math.abs(dx)>2)p.x=Math.max(0,Math.min(100,gs.x+(cx-gs.cx)*100/dx));if(Math.abs(dy)>2)p.y=Math.max(0,Math.min(100,gs.y+(cy-gs.cy)*100/dy));const r=d.querySelectorAll('input[type=range]');r[0].value=p.zoom;r[1].value=p.x;r[2].value=p.y;update()};aperture.onpointerup=aperture.onpointercancel=e=>{pts.delete(e.pointerId);if(pts.size)gestureStart();else gs=null};
sheet('写る範囲を調整',d);requestAnimationFrame(()=>{const parent=aperture.parentElement;const W=Math.min(parent.clientWidth,parent.clientHeight*ratio);aperture.style.width=W+'px';aperture.style.height=W/ratio+'px';update()})}

function move(x){const d=stripDrag;if(!d)return;d.last=x;const r=strip.getBoundingClientRect();cancelAnimationFrame(raf);const edge=36;if(x<r.left+edge||x>r.right-edge){const step=()=>{if(!stripDrag)return;strip.scrollLeft+=x<r.left+edge?-6:6;place(stripDrag.last);raf=requestAnimationFrame(step)};raf=requestAnimationFrame(step)}place(x)}
function place(x){const d=stripDrag,btn=d.btn,list=items();for(const o of list){if(o===btn)continue;const b=o.getBoundingClientRect(),c=b.left+b.width/2;const idxO=list.indexOf(o),idxM=list.indexOf(btn);if(idxO>idxM&&x>c){o.after(btn);break}if(idxO<idxM&&x<c){o.before(btn);break}}const me=btn.getBoundingClientRect(),natural=me.left-(new DOMMatrix(getComputedStyle(btn).transform).m41||0);btn.style.transform=`translateX(${x-(natural+me.width/2)}px) scale(1.08)`}
function finish(){const d=stripDrag;cancelAnimationFrame(raf);if(!d)return;d.btn.classList.remove('lifting');d.btn.style.transform='';strip.classList.remove('reordering');const shown=items().map(b=>b.dataset.key),old=loadOrder();const rest=old.filter(k=>!shown.includes(k));const all=sortedTemplates(S.n).map(t=>t.key);saveOrder([...shown,...rest.filter(k=>!all.includes(k))]);stripDrag=null;stripSuppressClick=Date.now()+400;strip.dataset.sig='';renderLayoutControls();clearSel();toast('並び順を保存しました')}
function cancelPress(){clearTimeout(timer);timer=null;if(start&&start.btn)start.btn.classList.remove('pressing');start=null}
strip.addEventListener('touchstart',e=>{if(e.touches.length!==1)return cancelPress();const btn=e.target.closest('button[data-key]');if(!btn||btn.disabled)return;const t=e.touches[0];start={btn,x:t.clientX,y:t.clientY};btn.classList.add('pressing');timer=setTimeout(()=>{if(start){begin(start.btn,start.x);start=null}},450)},{passive:true});
strip.addEventListener('touchmove',e=>{const t=e.touches[0];if(stripDrag){e.preventDefault();move(t.clientX);return}if(start&&Math.hypot(t.clientX-start.x,t.clientY-start.y)>8)cancelPress()},{passive:false});
strip.addEventListener('touchend',e=>{if(stripDrag){e.preventDefault();finish()}cancelPress()},{passive:false});
strip.addEventListener('touchcancel',()=>{if(stripDrag)finish();cancelPress()});
strip.addEventListener('mousedown',e=>{if(e.button!==0)return;const btn=e.target.closest('button[data-key]');if(!btn||btn.disabled)return;start={btn,x:e.clientX,y:e.clientY};btn.classList.add('pressing');timer=setTimeout(()=>{if(start){begin(start.btn,start.x);start=null}},450)});
window.addEventListener('mousemove',e=>{if(stripDrag){e.preventDefault();move(e.clientX)}else if(start&&Math.hypot(e.clientX-start.x,e.clientY-start.y)>8)cancelPress()});
window.addEventListener('mouseup',()=>{if(stripDrag)finish();cancelPress()});
})();

// no-select-v1: 長押し中の文字選択・コピーメニュー・画像メニューを止める
function clearSel(){try{const s=window.getSelection&&window.getSelection();if(s&&s.rangeCount)s.removeAllRanges()}catch{}}
const isEditable=el=>!!(el&&el.closest&&el.closest('input,textarea,[contenteditable="true"]'));
document.addEventListener('selectstart',e=>{if(!isEditable(e.target))e.preventDefault()});
document.addEventListener('contextmenu',e=>{if(!isEditable(e.target))e.preventDefault()});
document.addEventListener('dragstart',e=>{if(e.target&&e.target.tagName==='IMG')e.preventDefault()});
// 写真の入れ替え（長押しドラッグ）中は画面がスクロールしたり選択が出たりしないように
board.addEventListener('touchmove',e=>{if(board.querySelector('.dragging')&&e.cancelable){e.preventDefault();clearSel()}},{passive:false});
board.addEventListener('pointerdown',()=>clearSel());
new MutationObserver(()=>{if(board.querySelector('.dragging'))clearSel()}).observe(board,{subtree:true,attributes:true,attributeFilter:['class']});

const renderBeforeFitSeg=render;render=function(){renderBeforeFitSeg();renderFitSeg();renderGapBg()};render();

// bg-photo-v1: 背景に写真を敷く

function loadImg(src){if(bgImgCache.has(src))return bgImgCache.get(src);const pr=new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=src});bgImgCache.set(src,pr);return pr}
async function drawBgImg(ctx,W,H){try{const im=await loadImg(S.bgImg),sc=Math.max(W/im.naturalWidth,H/im.naturalHeight),dw=im.naturalWidth*sc,dh=im.naturalHeight*sc;ctx.drawImage(im,(W-dw)/2,(H-dh)/2,dw,dh)}catch{}}
async function fileToBgData(file){const url=URL.createObjectURL(file);try{const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});const M=2000,sc=Math.min(1,M/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*sc);c.height=Math.round(im.naturalHeight*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.88)}finally{URL.revokeObjectURL(url)}}
$('#bgPhoto').onclick=()=>{if(loading)return;$('#bgFile').value='';$('#bgFile').click()};
$('#bgFile').onchange=async e=>{const f=e.target.files&&e.target.files[0];if(!f)return;try{toast('背景の写真を読み込み中…');S.bgImg=await fileToBgData(f);commit();toast('背景に写真を敷きました。色を選ぶと元に戻ります')}catch{toast('この写真は読み込めませんでした')}};
document.querySelectorAll('#bgSeg [data-bg]').forEach(b=>{const prev=b.onclick;b.onclick=()=>{if(S.bgImg){S.bgImg=null;S.bg=b.dataset.bg;commit();return}prev&&prev()}});
(()=>{const inp=$('#bgCustom');if(!inp)return;inp.addEventListener('input',()=>{if(S.bgImg)S.bgImg=null},true)})();
function renderBgPhoto(){const has=!!S.bgImg;board.style.background=boardBg();const btn=$('#bgPhoto');if(!btn)return;btn.classList.toggle('active',has);btn.setAttribute('aria-checked',String(has));btn.disabled=loading;const sw=btn.querySelector('.sw');sw.classList.toggle('has',has);sw.style.backgroundImage=has?`url("${S.bgImg}")`:'';if(has){document.querySelectorAll('#bgSeg [data-bg]').forEach(b=>{b.classList.remove('active');b.setAttribute('aria-checked','false')});const lab=document.querySelector('#bgSeg .swCustom');if(lab){lab.classList.remove('active');lab.querySelector('.sw').style.background=''}}}

// count-wheel-v1: 「4枚」をタップすると枚数ホイールが浮かび上がり、上下に動かして選べる
function openCountWheel(){if(loading||document.querySelector('.countWheel'))return;$('#countValue').classList.add('open');const anchor=$('#countValue'),r=anchor.getBoundingClientRect(),MIN=2,MAX=9,H=40;const bd=document.createElement('div');bd.className='cwBackdrop';const w=document.createElement('div');w.className='countWheel';w.setAttribute('role','listbox');w.setAttribute('aria-label','枚数');const band=document.createElement('div');band.className='cwBand';const list=document.createElement('div');list.className='cwList';const pad=()=>{const p=document.createElement('div');p.className='cwPad';return p};list.append(pad());for(let n=MIN;n<=MAX;n++){const it=document.createElement('div');it.className='cwItem';it.dataset.n=n;it.innerHTML=n+'<small>枚</small>';it.setAttribute('role','option');it.onclick=()=>{if(+it.dataset.n===cur()){done();return}list.scrollTo({top:(n-MIN)*H,behavior:'smooth'})};list.append(it)}list.append(pad());w.append(band,list);document.body.append(bd,w);
const top=Math.max(8,r.top-150-12),left=Math.min(innerWidth-88,Math.max(8,r.left+r.width/2-40));Object.assign(w.style,{top:top+'px',left:left+'px'});
list.scrollTop=(S.n-MIN)*H;const cur=()=>Math.max(MIN,Math.min(MAX,MIN+Math.round(list.scrollTop/H)));let last=S.n,t=null;const mark=()=>{const c=cur();list.querySelectorAll('.cwItem').forEach(el=>el.classList.toggle('on',+el.dataset.n===c));if(c!==last){last=c;anchor.textContent=c+'枚';try{navigator.vibrate&&navigator.vibrate(6)}catch{}}};mark();
list.addEventListener('scroll',()=>{mark();clearTimeout(t);t=setTimeout(()=>{const c=cur();if(c!==S.n)setCount(c)},140)},{passive:true});
function done(){clearTimeout(t);const c=cur();if(c!==S.n)setCount(c);w.remove();bd.remove();$('#countValue').classList.remove('open');render()}
bd.addEventListener('pointerdown',e=>{e.preventDefault();done()});document.addEventListener('keydown',function k(e){if(e.key==='Escape'){done();document.removeEventListener('keydown',k)}})}
$('#countValue').onclick=openCountWheel;

// shuffle-v1: 写真の位置をランダムに入れ替え（配置の帯、おまかせの右）
function shuffleSlots(){const idx=S.slots.map((p,i)=>p?i:-1).filter(i=>i>=0);if(idx.length<2){toast('写真が2枚以上あると入れ替えられます');return}const ps=idx.map(i=>S.slots[i]);let order;for(let k=0;k<8;k++){order=ps.slice();for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}if(order.some((p,i)=>p!==ps[i]))break}idx.forEach((slot,k)=>S.slots[slot]=order[k]);selected=-1;swapFrom=-1;commit()}

$('#shuffleBtn').onclick=shuffleSlots;
const renderBeforeV8=render;render=function(){renderBeforeV8();renderBgPhoto();const cv=$('#countValue');if(cv)cv.disabled=loading;const sb=$('#shuffleBtn');if(sb)sb.disabled=loading||S.slots.filter(Boolean).length<2};render();
</script></body></html>
