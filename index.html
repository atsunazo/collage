 if(spec.poly){const L=polyLayout(S.tpl,S.n);hDrag={spec,key:L.key,o:L.o,pts:L.base.map(p=>p.slice()),moved:false}}
 else{const root=JSON.parse(JSON.stringify(curTree()));let node=root;for(const c of spec.path)node=node[c];hDrag={spec,root,node,a0:node.a,b0:node.b,start,moved:false}}
 const buzz=()=>{if(!snapBuzz){snapBuzz=true;try{navigator.vibrate&&navigator.vibrate(8)}catch{}}};
 el.onpointermove=ev=>{if(!hDrag)return;const [u,v]=toUV(ev),sp=hDrag.spec,cl=q=>Math.max(.05,Math.min(.95,q));
  if(sp.poly){let [x,y]=orient(hDrag.o,[u,v]);const c=q=>Math.max(.06,Math.min(.94,q)),k=sp.kind;if(k==='t'){x=c(x);y=0}else if(k==='b'){x=c(x);y=1}else if(k==='l'){x=0;y=c(y)}else if(k==='r'){x=1;y=c(y)}else{x=c(x);y=c(y)}hDrag.pts[sp.i]=[x,y];S.pv={key:hDrag.key,pts:hDrag.pts.map(p=>p.slice())}}
  else if(sp.slide){const proj=(seg)=>{const [A,B]=seg,dx=B[0]-A[0],dy=B[1]-A[1];return((u-hDrag.start[0])*dx+(v-hDrag.start[1])*dy)/((dx*dx+dy*dy)||1)};const n=hDrag.node;n.a=cl(hDrag.a0+proj(sp.A.seg));n.b=cl(hDrag.b0+proj(sp.B.seg));S.tree={key:treeKey(),root:hDrag.root}}
  else{const [A,B]=sp.seg,dx=B[0]-A[0],dy=B[1]-A[1];let t=cl(((u-A[0])*dx+(v-A[1])*dy)/((dx*dx+dy*dy)||1));const n=hDrag.node,other=sp.w==='a'?n.b:n.a;
   // まっすぐの位置に吸い付く
   if(Math.abs(t-other)<.025){t=other;buzz()}else snapBuzz=false;n[sp.w]=t;S.tree={key:treeKey(),root:hDrag.root}}
  hDrag.moved=true;if(S.auto!==false)S.auto=false;sizeBoard()};
 el.onpointerup=el.onpointercancel=()=>{el.classList.remove('drag');el.onpointermove=el.onpointerup=el.onpointercancel=null;const moved=hDrag&&hDrag.moved;hDrag=null;hSig='';if(moved)commit();else renderHandles()}}
// 全体の「ななめ」：すべての線を一度に交互に傾ける（細かい調整はブロックごとに）
function walkNodes(n,f,k={i:0}){if(!n||n.leaf!=null)return;f(n,k.i++);walkNodes(n.L,f,k);walkNodes(n.R,f,k)}
function applyTiltAll(val){const root=baseTree();if(!root)return;const d=val/100;walkNodes(root,(n,i)=>{const s=i%2?-1:1;n.a=Math.max(.05,Math.min(.95,n.a+d*s));n.b=Math.max(.05,Math.min(.95,n.b-d*s))});S.tree={key:treeKey(),root};S.tilt=val;if(S.auto!==false)S.auto=false}
(()=>{const r=$('#tiltAll');r.addEventListener('input',()=>{hDrag={tilt:true};applyTiltAll(+r.value);sizeBoard()});r.addEventListener('change',()=>{hDrag=null;if(+r.value===0){S.tree=null;S.tilt=0}commit()})})();
// 編集中は写真をタップすると「選ぶ」になる（メニューや入れ替えは出さない）
const cellClickBeforeShape=cellClick;cellClick=function(i){if(editLines){selBlock=selBlock===i?-1:i;hSig='';renderHandles();return}cellClickBeforeShape(i)};
const installDragBeforeShape=installDrag;installDrag=function(){if(!editLines)installDragBeforeShape()};
$('#lineEdit').onclick=()=>setEditLines(!editLines);
$('#polyFlip').onclick=()=>{if(!isDiag())return;S.por=((S.por||0)+1)%4;commit()};
$('#polyReset').onclick=()=>{if(isDiag()){S.pv=null;S.por=0}else{S.tree=null;S.tilt=0}commit();toast('元の形に戻しました')};
// 余白に「ぼかし」を追加。長押しで角の丸み・ぼかしの幅・重なりを調整
document.querySelectorAll('#gapSeg [data-gap]').forEach(b=>b.onclick=()=>{const v=+b.dataset.gap;if(S.gap===v&&!S.blend)return;S.gap=v;S.blend=false;commit()});
$('#blendBtn').onclick=()=>{if(S.blend)return;S.blend=true;commit()};
const renderGapBgBeforeFx=renderGapBg;renderGapBg=function(){renderGapBgBeforeFx();if(S.blend)document.querySelectorAll('#gapSeg [data-gap]').forEach(b=>{b.classList.remove('active');b.setAttribute('aria-checked','false')});const bb=$('#blendBtn');bb.classList.toggle('active',!!S.blend);bb.setAttribute('aria-checked',String(!!S.blend));bb.disabled=loading};
function openFxSheet(){const before={radius:S.radius||0,feather:S.feather??3,overlap:S.overlap??3,blend:!!S.blend};const d=document.createElement('div');const rows=[['radius','角の丸み',0,8,'なし','大きく']];if(S.blend)rows.push(['feather','ぼかしの幅',1,8,'くっきり','ふんわり'],['overlap','重なり',0,8,'少なめ','多め']);
 for(const [key,label,min,max,lo,hi] of rows){const row=document.createElement('label');row.className='rangeRow fxRow';row.innerHTML='<span>'+label+'</span><small>'+lo+'</small>';const r=document.createElement('input');Object.assign(r,{type:'range',min,max,step:.5,value:before[key]});r.oninput=()=>{S[key]=+r.value;sizeBoard()};const s=document.createElement('small');s.textContent=hi;row.append(r,s);d.append(row)}
 if(!S.blend){const n=document.createElement('p');n.className='lmInfo';n.textContent='「ぼかし」を選ぶと、写真の境目をぼかして重ねられます。';d.append(n)}
 const a=document.createElement('div');a.className='choices';const no=document.createElement('button');no.textContent='キャンセル';no.onclick=()=>{Object.assign(S,before);close();render()};const ok=document.createElement('button');ok.className='primary';ok.textContent='決定';ok.onclick=()=>{close();commit()};a.append(no,ok);d.append(a);sheet(S.blend?'ぼかしの調整':'余白の調整',d)}
(()=>{let t=null,fired=false,x0=0,y0=0;const seg=$('#gapSeg');seg.addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;fired=false;x0=e.clientX;y0=e.clientY;b.classList.add('pressing');t=setTimeout(()=>{fired=true;b.classList.remove('pressing');try{navigator.vibrate&&navigator.vibrate(10)}catch{}if(b.id==='blendBtn'&&!S.blend){S.blend=true;commit()}openFxSheet()},450)});const stop=()=>{clearTimeout(t);seg.querySelectorAll('.pressing').forEach(b=>b.classList.remove('pressing'))};seg.addEventListener('pointermove',e=>{if(Math.hypot(e.clientX-x0,e.clientY-y0)>8)stop()});seg.addEventListener('pointerup',stop);seg.addEventListener('pointercancel',stop);seg.addEventListener('pointerleave',stop);seg.addEventListener('click',e=>{if(fired){e.stopPropagation();e.preventDefault();fired=false}},true)})();
render();
