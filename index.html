</style></head><body>

<main class="workspace" id="workspace"><div class="board" id="board" aria-label="コラージュのプレビュー"></div></main>
<footer class="bottom"><div class="commandBar"><button aria-label="元に戻す" id="undo" title="元に戻す"><svg aria-hidden="true" viewbox="0 0 24 24"><path d="m9 5-5 5 5 5m-5-5h9a6 6 0 0 1 0 12" transform="translate(0 -1)"></path></svg></button><button aria-label="やり直す" id="redo" title="やり直す"><svg aria-hidden="true" viewbox="0 0 24 24"><path d="m15 5 5 5-5 5m5-5h-9a6 6 0 0 0 0 12" transform="translate(0 -1)"></path></svg></button><span class="spacer"></span><button class="add" id="add">写真を選ぶ</button><button id="save" class="primary" disabled>保存</button></div><div class="settings"><button id="count">枚数<span>4枚</span></button><button id="layout">配置<span>2列 × 2段</span></button><button id="gap">余白<span>小</span></button><button id="bg">背景<span>白</span></button></div><p id="hint" hidden></p></footer>
<input type="file" id="files" accept="image/*" multiple hidden><div id="toast" class="toast" role="status" hidden></div>
<dialog id="sheet"><div class="sheetHead"><h2 id="sheetTitle"></h2><button id="closeSheet" aria-label="閉じる">×</button></div><div id="sheetBody"></div></dialog>
<section id="editor" class="editScreen" hidden><header><button id="cancelEdit">キャンセル</button><span>写真を編集</span></header><iframe id="editFrame" title="顔隠し・写真編集"></iframe></section>
<script>
'use strict';
const $=s=>document.querySelector(s),board=$('#board'),ws=$('#workspace');
let S={n:4,cols:2,shape:'auto',gap:8,bg:'#ffffff',slots:Array(4).fill(null)},history=[],hi=-1,selected=-1,swapFrom=-1,pickTarget=-1,loading=false,editorReady=false,editId=null,pendingEdit=null;
const images=new Map(),urls=new Set();let timer;const clone=s=>({...s,slots:s.slots.map(x=>x?{...x,masks:x.masks?JSON.parse(JSON.stringify(x.masks)):undefined}:null)});
function toast(t){$('#toast').textContent=t;$('#toast').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('#toast').hidden=true,3500)}
function commit(){history=history.slice(0,hi+1);history.push(clone(S));if(history.length>16)history.shift();hi=history.length-1;render()}
function restore(i){if(i<0||i>=history.length)return;hi=i;S=clone(history[i]);swapFrom=-1;render()}
function grid(){let aspect=4/3;const first=S.slots.find(Boolean);if(first)aspect=first.w/first.h;aspect=Math.max(.5,Math.min(2,aspect));const rows=Math.ceil(S.n/S.cols);let ratio=S.cols/rows*aspect;if(S.shape!=='auto')ratio=Number(S.shape);return{rows,ratio}}
function dimensions(edge){const {rows,ratio}=grid();const W=ratio>=1?edge:Math.round(edge*ratio),H=ratio>=1?Math.round(edge/ratio):edge;const gap=S.gap*edge/1600;return{W,H,gap,cw:(W-gap*(S.cols+1))/S.cols,ch:(H-gap*(rows+1))/rows,rows}}
function sizeBoard(){const {ratio}=grid();const w=Math.max(50,ws.clientWidth-28),h=Math.max(50,ws.clientHeight-28);const W=Math.min(w,h*ratio),H=W/ratio;board.style.width=W+'px';board.style.height=H+'px';board.style.gridTemplateColumns=`repeat(${S.cols},minmax(0,1fr))`;board.style.gridTemplateRows=`repeat(${Math.ceil(S.n/S.cols)},minmax(0,1fr))`;const g=S.gap*Math.max(W,H)/1600;board.style.padding=g+'px';board.style.gap=g+'px';board.style.background=S.bg}
function render(){board.replaceChildren();S.slots.forEach((p,i)=>{const b=document.createElement('button');b.className='cell'+(!p?' empty':'')+(swapFrom===i?' swap':'');b.setAttribute('aria-label',p?`${i+1}枚目を編集`:`${i+1}枚目を追加`);if(p){const im=document.createElement('img');im.src=p.src;im.alt='';applyImageStyle(im,p);b.append(im);const no=document.createElement('span');no.className='number';no.textContent=i+1;b.append(no)}else b.innerHTML='<span class="plus"><b>＋</b>写真を追加</span>';b.onclick=()=>cellClick(i);board.append(b)});sizeBoard();$('#count span').textContent=S.n+'枚';$('#layout span').textContent=S.cols+'列 × '+Math.ceil(S.n/S.cols)+'段';$('#gap span').textContent=S.gap===0?'なし':S.gap===8?'小':'大';$('#bg span').textContent=({'#ffffff':'白','#18151b':'黒','#fff0f6':'ピンク'})[S.bg]||'カスタム';$('#undo').disabled=hi<=0;$('#redo').disabled=hi>=history.length-1;const has=S.slots.some(Boolean);$('#save').disabled=!has||loading;$('#add').disabled=loading;$('#add').textContent=loading?'読込中…':has?'写真を追加':'写真を選ぶ';$('#hint').textContent=swapFrom>=0?'入れ替え先の枠をタップしてください':has?'写真をタップして、顔隠し・調整・入れ替え':'空いている枠の＋から、1枚ずつ追加できます'}
function applyImageStyle(im,p){im.style.objectFit=p.fit||'contain';im.style.objectPosition=(p.x??50)+'% '+(p.y??50)+'%';im.style.transform=`scale(${p.zoom||1})`;im.style.transformOrigin=(p.x??50)+'% '+(p.y??50)+'%'}
function sheet(title,content){$('#sheetTitle').textContent=title;$('#sheetBody').replaceChildren();if(typeof content==='string')$('#sheetBody').innerHTML=content;else $('#sheetBody').append(content);if(!$('#sheet').open)$('#sheet').showModal()}
function close(){$('#sheet').close()}$('#closeSheet').onclick=close;$('#sheet').addEventListener('click',e=>{if(e.target===$('#sheet')){const r=$('#sheet').getBoundingClientRect();if(e.clientY<r.top)close()}});
function choices(items,active,fn){const d=document.createElement('div');d.className='choices';items.forEach(([value,label])=>{const b=document.createElement('button');b.textContent=label;if(value===active)b.className='active';b.onclick=()=>fn(value);d.append(b)});return d}
$('#count').onclick=()=>sheet('何枚まとめる？',choices([2,3,4,6,8,9].map(n=>[n,n+'枚']),S.n,n=>{if(n===S.n){close();return}if(n<S.n&&S.slots.slice(n).some(Boolean)){chooseReduced(n);return}setCount(n)}));
function setCount(n,slots){S.n=n;S.slots=slots||Array.from({length:n},(_,i)=>S.slots[i]||null);S.cols=n===9?3:n===3?1:2;close();commit()}
function chooseReduced(n){let picked=S.slots.map((p,i)=>p?i:-1).filter(i=>i>=0).slice(0,n);function show(){const d=document.createElement('div'),list=document.createElement('div');list.className='overflowList';S.slots.forEach((p,i)=>{if(!p)return;const b=document.createElement('button');b.className=picked.includes(i)?'active':'';const im=new Image();im.src=p.src;const no=document.createElement('span');no.textContent=picked.includes(i)?picked.indexOf(i)+1:'−';b.append(im,no);b.onclick=()=>{if(picked.includes(i))picked=picked.filter(v=>v!==i);else if(picked.length<n)picked.push(i);else toast(n+'枚まで選べます');show()};list.append(b)});d.append(list);const b=document.createElement('button');b.className='primary';b.textContent='選んだ写真で'+n+'枚に変更';b.onclick=()=>setCount(n,Array.from({length:n},(_,i)=>S.slots[picked[i]]||null));d.append(b);sheet('残す写真を選択',d)}show()}
$('#layout').onclick=()=>{const d=document.createElement('div');d.innerHTML='<p class="label">並べ方</p>';const opts=[...new Set([1,2,3,4].filter(c=>S.n%c===0))];d.append(choices(opts.map(c=>[c,c+'列 × '+S.n/c+'段']),S.cols,c=>{S.cols=c;commit();close()}));const label=document.createElement('p');label.className='label';label.textContent='完成画像の形';d.append(label,choices([['auto','写真に合わせる'],['1','正方形'],['0.8','縦長'],['1.3333333333','横長']],S.shape,v=>{S.shape=v;commit();close()}));sheet('配置',d)};
$('#gap').onclick=()=>sheet('余白',choices([[0,'なし'],[8,'小'],[24,'大']],S.gap,v=>{S.gap=v;commit();close()}));
$('#bg').onclick=()=>{const d=document.createElement('div'),c=choices([['#ffffff','白'],['#18151b','黒'],['#fff0f6','ピンク']],S.bg,v=>{S.bg=v;commit();close()});d.append(c);const l=document.createElement('label');l.className='rangeRow';l.textContent='好きな色 ';const input=document.createElement('input');input.type='color';input.value=S.bg;input.onchange=()=>{S.bg=input.value;commit();close()};l.append(input);d.append(l);sheet('背景',d)};
function pick(i=-1){pickTarget=i;$('#files').multiple=i<0;$('#files').click()}$('#add').onclick=()=>{if(!S.slots.includes(null)){toast('すべての枠に写真が入っています。写真をタップして変更できます');return}pick()};
function cellClick(i){if(loading)return;if(swapFrom>=0){[S.slots[i],S.slots[swapFrom]]=[S.slots[swapFrom],S.slots[i]];swapFrom=-1;commit();return}if(!S.slots[i]){pick(i);return}selected=i;const d=document.createElement('div');d.className='sheetActions';[['写る範囲を調整',()=>adjust(i)],['顔を隠す・写真を編集',()=>openEditor(i)],['別の写真に変更',()=>{close();pick(i)}],['別の枠と入れ替え',()=>{close();swapFrom=i;render()}],['この写真を外す',()=>{S.slots[i]=null;close();commit()}]].forEach(([text,fn])=>{const b=document.createElement('button');b.textContent=text;b.onclick=fn;d.append(b)});sheet((i+1)+'枚目の写真',d)}
async function importFile(file){const u=URL.createObjectURL(file);try{const im=new Image();im.src=u;await im.decode();const k=Math.min(1,2400/Math.max(im.naturalWidth,im.naturalHeight));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.naturalWidth*k));c.height=Math.max(1,Math.round(im.naturalHeight*k));c.getContext('2d').drawImage(im,0,0,c.width,c.height);const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.95));if(!blob)throw Error();const src=URL.createObjectURL(blob);urls.add(src);images.set(src,c);return{id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),src,w:c.width,h:c.height,fit:'contain',zoom:1,x:50,y:50}}finally{URL.revokeObjectURL(u)}}
$('#files').onchange=async e=>{let files=Array.from(e.target.files);e.target.value='';if(!files.length)return;const target=pickTarget,empty=S.slots.map((v,i)=>v?-1:i).filter(i=>i>=0);const max=target>=0?1:empty.length;const tooMany=files.length>max;loading=true;render();let records=[],failed=0;for(const f of files){try{records.push(await importFile(f))}catch{failed++}}loading=false;if(tooMany&&records.length>max){chooseImports(records,max,target,empty);render()}else{placeRecords(records,target,empty);if(failed)toast(failed+'枚を読み込めませんでした。JPEG・PNGなどをお試しください')}};
function placeRecords(records,target,empty){records.forEach((p,i)=>{const dest=target>=0?target:empty[i];if(dest!==undefined)S.slots[dest]=p});close();commit()}
function chooseImports(records,max,target,empty){let chosen=records.map((_,i)=>i).slice(0,max);function show(){const d=document.createElement('div'),list=document.createElement('div');list.className='overflowList';records.forEach((p,i)=>{const b=document.createElement('button');b.className=chosen.includes(i)?'active':'';const im=new Image();im.src=p.src;const no=document.createElement('span');no.textContent=chosen.includes(i)?chosen.indexOf(i)+1:'−';b.append(im,no);b.onclick=()=>{if(chosen.includes(i))chosen=chosen.filter(v=>v!==i);else if(chosen.length<max)chosen.push(i);else toast(max+'枚まで選べます');show()};list.append(b)});const b=document.createElement('button');b.className='primary';b.textContent='選んだ'+chosen.length+'枚を配置';b.disabled=!chosen.length;b.onclick=()=>placeRecords(chosen.map(i=>records[i]),target,empty);d.append(list,b);sheet('使用する写真を選択（'+max+'枚まで）',d)}show()}

window.collageApply=async record=>{try{const i=S.slots.findIndex(p=>p&&p.id===editId);if(i<0)return;const blob=await new Promise(r=>record.canvas.toBlob(r,'image/png'));if(!blob)throw Error();const src=URL.createObjectURL(blob);urls.add(src);images.set(src,record.canvas);S.slots[i]={...S.slots[i],base:record.base,masks:record.masks,src,w:record.canvas.width,h:record.canvas.height};$('#editor').hidden=true;pendingEdit=null;commit()}catch{toast('反映できませんでした。もう一度お試しください')}};
$('#cancelEdit').onclick=()=>{$('#editor').hidden=true;pendingEdit=null};
async function getImage(p){if(images.has(p.src))return images.get(p.src);const im=new Image();im.src=p.src;await im.decode();images.set(p.src,im);return im}
function drawCell(ctx,im,p,x,y,w,h){const iw=p.w,ih=p.h,cover=p.fit==='cover',scale=(cover?Math.max(w/iw,h/ih):Math.min(w/iw,h/ih))*(p.zoom||1),dw=iw*scale,dh=ih*scale,fx=(p.x??50)/100,fy=(p.y??50)/100;ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();ctx.drawImage(im,x+(w-dw)*fx,y+(h-dh)*fy,dw,dh);ctx.restore()}
async function output(){const d=dimensions(2400),c=document.createElement('canvas');c.width=d.W;c.height=d.H;const ctx=c.getContext('2d');ctx.fillStyle=S.bg;ctx.fillRect(0,0,c.width,c.height);for(let i=0;i<S.n;i++){const p=S.slots[i];if(!p)continue;const im=await getImage(p);drawCell(ctx,im,p,d.gap+(i%S.cols)*(d.cw+d.gap),d.gap+Math.floor(i/S.cols)*(d.ch+d.gap),d.cw,d.ch)}const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.95));if(!b)throw Error('encode');return b}
async function openSave(){if(loading)return;loading=true;render();try{const blob=await output(),name='collage-'+new Date().toISOString().slice(0,10)+'.jpg',file=new File([blob],name,{type:'image/jpeg'});const d=document.createElement('div');d.className='sheetActions';const download=document.createElement('button');download.className='primary';download.textContent='画像を保存';download.onclick=()=>{const u=URL.createObjectURL(blob);urls.add(u);const a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();close()};d.append(download);if(navigator.canShare&&navigator.canShare({files:[file]})){const share=document.createElement('button');share.textContent='共有';share.onclick=async()=>{try{await navigator.share({files:[file]});close()}catch(e){if(e.name!=='AbortError')toast('共有できませんでした')}};d.append(share)}sheet('保存',d)}catch(e){toast('画像を作れませんでした。もう一度お試しください')}finally{loading=false;render()}}$('#save').onclick=openSave;$('#undo').onclick=()=>restore(hi-1);$('#redo').onclick=()=>restore(hi+1);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&swapFrom>=0){swapFrom=-1;render()}if((e.ctrlKey||e.metaKey)&&e.key==='z'&&!$('#sheet').open&&$('#editor').hidden){e.preventDefault();restore(hi+(e.shiftKey?1:-1))}});new ResizeObserver(sizeBoard).observe(ws);window.addEventListener('beforeunload',()=>urls.forEach(u=>URL.revokeObjectURL(u)));commit();
